spring.application.name=slaughterhouse-server
spring.datasource.url=jdbc:postgresql://localhost:5432/slaughterhouse
spring.datasource.username=postgres
spring.datasource.password=arsenie

# The tables are created by schema.sql, so Hibernate must never create or change them
spring.jpa.hibernate.ddl-auto=none
# Prints the SQL Hibernate generates from the JPQL queries (handy for checking; remove when done)
spring.jpa.show-sql=true
