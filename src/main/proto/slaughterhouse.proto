syntax = "proto3";

option java_multiple_files = true;
package dk.via.pro3.slaughterhouse.generated; // generated code, ignored by git


service SlaughterhouseService {
  rpc GetAnimalsByProduct(GetAnimalsByProductRequest) returns (GetAnimalsByProductResponse);
  rpc GetProductsByAnimal(GetProductsByAnimalRequest) returns (GetProductsByAnimalResponse);
}

message Product {
  int32 product_id = 1;
  string name = 2;
  string product_type = 3;
  string packaged_date = 4;
}

message GetAnimalsByProductRequest {
  int32 product_id = 1;
}

message GetAnimalsByProductResponse {
  repeated string registration_numbers = 1;
}

message GetProductsByAnimalRequest {
  string registration_number = 1;
}

message GetProductsByAnimalResponse {
  repeated Product products = 1;
}
