$kind: http-request
order: 11000
method: POST
url: '{{base_url}}/api/v1/animals'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "registrationNumber": "{{run_id}}-invalid",
      "species": "Pig",
      "weightKg": 120.125,
      "arrivalDate": "2026-11-05",
      "origin": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Missing farm returns 400', () => pm.response.to.have.status(400));
